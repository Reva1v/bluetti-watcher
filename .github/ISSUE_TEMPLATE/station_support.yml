name: Station support
description: Report how Bluetti Watcher works (or does not) with a BLUETTI model other than the AC200PL.
labels: [station-support]
body:
  - type: markdown
    attributes:
      value: |
        Only the AC200PL is tested. Other models that bluetti-bt-lib supports may work with `type` set in config.json.
        A report either way helps others with the same station. Remove the station's Bluetooth address (MAC) from
        anything you paste.
  - type: input
    id: model
    attributes:
      label: Station model
      placeholder: AC180, EB3A, AC300 + B300, ...
    validations:
      required: true
  - type: input
    id: type
    attributes:
      label: The `type` value in config.json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bluetti Watcher version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works (battery, load and mains state are right)
        - Partly works (some values missing or wrong)
        - Does not work (no readings)
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What is right and what is wrong
      description: Compare the dashboard with the station's own display (battery %, AC input, AC output load).
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Last 50 lines of service.log (MAC removed)
      description: |
        `Get-Content "$env:LOCALAPPDATA\bluetti-watcher\service.log" -Tail 50`
      render: text
