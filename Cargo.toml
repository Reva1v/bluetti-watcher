[package]
name = "bluetti-watcher"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
md-5 = "0.10"
nvml-wrapper = "0.13.0"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
rand = "0.8"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tao = { version = "0.37.1", default-features = false, features = ["rwh_06"] }
tauri-winrt-notification = "0.8.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync", "net"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
wry = { version = "0.57.0", default-features = false }
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Bluetooth_Advertisement", "Devices_Radios", "Storage_Streams", "Web_Http", "Web_Http_Filters", "Web_Http_Headers", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Power", "Win32_Security", "Win32_System_Registry", "Win32_System_TaskScheduler", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Services"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"
codegen-units = 1

[dev-dependencies]
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[build-dependencies]
winresource = "0.1.34"
