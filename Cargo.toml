[package]
name = "bluetti-watcher"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
md-5 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
rand = "0.8"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tao = { version = "0.37.1", default-features = false, features = ["rwh_06"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Bluetooth_Advertisement", "Devices_Radios", "Storage_Streams", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Power", "Win32_Security"] }
wry = { version = "0.57.0", default-features = false }

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"
codegen-units = 1
